<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Set password · Signal Desk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#eef2f7;color:#0f172a;
      display:flex;align-items:center;justify-content:center;padding:16px}
    .card{background:#fff;border-radius:20px;padding:28px 24px;max-width:420px;width:100%;
      box-shadow:0 24px 64px rgba(15,23,42,.14)}
    .row{display:flex;gap:12px;align-items:center;margin-bottom:18px}
    .logo{width:42px;height:42px;border-radius:12px;background:#3b82f6;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
    h1{margin:0;font-size:20px} .sub{font-size:13px;color:#64748b;margin:2px 0 0}
    label{display:block;font-size:12px;font-weight:600;color:#475569;margin:12px 0 6px}
    input{width:100%;border:1px solid #e2e8f0;background:#f8fafc;border-radius:12px;padding:13px 14px;font-size:16px;font-family:inherit}
    button{width:100%;margin-top:16px;border:0;border-radius:999px;padding:14px;background:#3b82f6;color:#fff;font-weight:600;font-size:15px;font-family:inherit}
    .err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:12px;padding:11px;font-size:13px;margin-bottom:8px}
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="logo">SD</div>
      <div><h1>Create password</h1><div class="sub">Welcome, @{{ user.username }}</div></div>
    </div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post" action="/setup-password">
      <label>Password</label>
      <input type="password" name="password" required minlength="6" autocomplete="new-password" />
      <label>Confirm password</label>
      <input type="password" name="password2" required minlength="6" autocomplete="new-password" />
      <button type="submit">Continue to credentials →</button>
    </form>
  </div>
</body>
</html>
