<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pending · Signal Desk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:#eef2f7;color:#0f172a;
      display:flex;align-items:center;justify-content:center;padding:16px}
    .card{background:#fff;border-radius:20px;padding:28px 24px;max-width:420px;width:100%;
      box-shadow:0 24px 64px rgba(15,23,42,.14)}
    .row{display:flex;gap:12px;align-items:center;margin-bottom:18px}
    .logo{width:42px;height:42px;border-radius:12px;background:#3b82f6;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
    h1{margin:0;font-size:20px} .sub{font-size:13px;color:#64748b;margin:2px 0 0}
    .badge{display:inline-block;background:#fffbeb;color:#b45309;border:1px solid #fde68a;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
    p{font-size:13px;color:#64748b;line-height:1.5}
    .btn{display:block;text-align:center;background:#3b82f6;color:#fff;text-decoration:none;border-radius:999px;padding:13px;font-weight:600;margin-top:16px}
    .link{display:block;text-align:center;color:#3b82f6;font-size:13px;font-weight:600;margin-top:12px;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <div class="logo">SD</div>
      <div><h1>Pending approval</h1><div class="sub">@{{ user.username }}</div></div>
    </div>
    <div class="badge">Awaiting review</div>
    <p>Your request was received. An operator will approve access and set your trading window. Refresh after you’re notified — then set a password and connect credentials.</p>
    <a class="btn" href="/pending">Refresh status</a>
    <a class="link" href="/logout">Sign out</a>
  </div>
</body>
</html>
